name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: smart-api-gateway.exe
            asset: smart-api-gateway-${{ github.ref_name }}-windows-x64.exe
          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact: smart-api-gateway
            asset: smart-api-gateway-${{ github.ref_name }}-macos-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: smart-api-gateway
            asset: smart-api-gateway-${{ github.ref_name }}-macos-arm64
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: smart-api-gateway
            asset: smart-api-gateway-${{ github.ref_name }}-linux-x64
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: smart-api-gateway
            asset: smart-api-gateway-${{ github.ref_name }}-linux-arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install pnpm and dependencies
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          pnpm remove sharp png-to-ico

      - name: Build
        run: |
          pnpm build:web-admin
          pnpm tauri build --features desktop --target ${{ matrix.target }}

      - name: Prepare artifact (rename)
        shell: bash
        run: |
          mkdir -p artifact
          binary_dir="src-tauri/target/${{ matrix.target }}/release"
          # Copy binary
          if [ -f "$binary_dir/smart-api-gateway.exe" ]; then
            cp "$binary_dir/smart-api-gateway.exe" "artifact/${{ matrix.asset }}"
          else
            cp "$binary_dir/smart-api-gateway" "artifact/${{ matrix.asset }}"
          fi
          # Copy installer bundles if present
          if [ -d "$binary_dir/bundle" ]; then
            find "$binary_dir/bundle" -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} artifact/ \; 2>/dev/null || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: artifact/*

  release-headless:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: smart-api-gateway-${{ github.ref_name }}-linux-x64-headless
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: smart-api-gateway-${{ github.ref_name }}-linux-arm64-headless

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: headless-${{ matrix.target }}

      - name: Install pnpm and dependencies
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          pnpm remove sharp png-to-ico

      - name: Build web-admin assets
        run: pnpm build:web-admin

      - name: Build headless binary
        working-directory: src-tauri
        run: cargo build --release --no-default-features --target ${{ matrix.target }}

      - name: Verify no GUI libraries linked
        run: |
          binary="src-tauri/target/${{ matrix.target }}/release/smart-api-gateway"
          if readelf -d "$binary" | grep -Ei 'libwebkit2gtk|libgtk-3|libgtk-4|libsoup'; then
            echo "::error::Headless binary unexpectedly links GUI libraries"
            exit 1
          fi
          echo "OK: no GTK/WebKit/libsoup NEEDED entries"

      - name: Prepare artifact (rename)
        run: |
          mkdir -p artifact
          cp "src-tauri/target/${{ matrix.target }}/release/smart-api-gateway" "artifact/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: artifact/*

  release-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      - name: Install pnpm and dependencies
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          pnpm remove sharp png-to-ico

      - name: Build web-admin assets
        run: pnpm build:web-admin

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for signed Android release APKs"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.keystore"

      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-signing/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm android:build

      - name: Prepare signed Android artifact
        shell: bash
        run: |
          set -euo pipefail
          output_dir="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          signed_dir="src-tauri/gen/android/app/build/outputs/apk/signed-release"
          mkdir -p "$signed_dir"
          mapfile -t signed_apks < <(find "$output_dir" -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | sort)
          if [ "${#signed_apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one signed Android APK, found ${#signed_apks[@]}"
            find "$output_dir" -maxdepth 1 -type f -name '*.apk' -print
            exit 1
          fi
          cp "${signed_apks[0]}" "$signed_dir/smart-api-gateway-${{ github.ref_name }}-android-universal.apk"

      - name: Verify Android APK signature
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose src-tauri/gen/android/app/build/outputs/apk/signed-release/*.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-api-gateway-${{ github.ref_name }}-android-universal-apk
          path: src-tauri/gen/android/app/build/outputs/apk/signed-release/*.apk

  publish:
    needs: [release, release-headless, release-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## API Switch ${{ github.ref_name }}

          ### Downloads

          **Portable binaries** (no install needed, just run):
          - `smart-api-gateway-windows-x64.exe` — Windows
          - `smart-api-gateway-macos-x64` — macOS Intel
          - `smart-api-gateway-macos-arm64` — macOS Apple Silicon
          - `smart-api-gateway-linux-x64` — Linux x64
          - `smart-api-gateway-linux-arm64` — Linux ARM64
          - `smart-api-gateway-linux-x64-headless` — Linux x64 (no GUI, smaller binary, suitable for servers/Termux)
          - `smart-api-gateway-linux-arm64-headless` — Linux ARM64 (no GUI, suitable for servers/Termux)
          - `smart-api-gateway-android-universal-apk` — Android universal APK

          **Installers** (system integration):
          - `*.msi` / `*.exe` — Windows installer
          - `*.dmg` — macOS disk image
          - `*.AppImage` — Linux AppImage

          ### Usage
          1. Download and run (or install via installer)
          2. Database is auto-created in the same directory
          3. Point your client to `http://127.0.0.1:9090`
          EOF

      - name: Create release
        id: create_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md

      - name: Create release (retry)
        if: steps.create_release.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
